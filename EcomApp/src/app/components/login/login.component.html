<div class="auth-page">
  <div class="auth-layout">
    <div class="auth-sidebar">
      <div class="auth-sidebar-content">
        <h2>Login</h2>
        <p>Get access to your Orders, Wishlist and Recommendations</p>
      </div>
    </div>

    <div class="auth-form-card">
      @for (n of notificationService.notifications(); track n.id) {
        <div class="notification notification-{{ n.type }}">{{ n.message }}</div>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <span class="material-icons form-icon">person</span>
          <input
            type="text"
            [(ngModel)]="loginData.emailOrUsername"
            name="emailOrUsername"
            placeholder="Enter Email or Username"
            required
          />
        </div>

        <div class="form-group">
          <span class="material-icons form-icon">lock</span>
          <input
            type="password"
            [(ngModel)]="loginData.password"
            name="password"
            placeholder="Enter Password"
            required
          />
        </div>

        <button type="submit" class="btn-login-submit" [disabled]="isLoading">
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>
      </form>

      <p class="auth-footer">
        New to ShopKart? <a routerLink="/register">Create an account</a>
      </p>
    </div>
  </div>
</div>
