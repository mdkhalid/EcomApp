<div class="auth-page">
  <div class="auth-card">
    @for (n of notificationService.notifications(); track n.id) {
      <div class="notification" [class.success]="n.type === 'success'" [class.error]="n.type === 'error'">{{ n.message }}</div>
    }

    @if (!sent()) {
      <h2>Forgot Password</h2>
      <p class="subtitle">Enter your email and we'll send you a reset link.</p>
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <span class="material-icons form-icon">email</span>
          <input type="email" [(ngModel)]="email" name="email" placeholder="Enter Email" required />
        </div>
        <button type="submit" class="btn-submit" [disabled]="isLoading">
          {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
        </button>
      </form>
    } @else {
      <h2>Check your inbox</h2>
      <p class="subtitle">If an account exists for <strong>{{ email }}</strong>, a reset link has been sent.</p>
    }

    <p class="auth-footer">
      <a routerLink="/login">Back to Login</a>
    </p>
  </div>
</div>
