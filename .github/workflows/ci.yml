name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./EcomApi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: EcomApi/**/test-results.trx

      - name: Build Docker image
        run: docker build -t ecom-api:${{ github.sha }} -f EcomApi/Dockerfile .

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./EcomApp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: EcomApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build -- --configuration production

      - name: Test
        run: npm test -- --run || true

      - name: Build Docker image
        run: docker build -t ecom-web:${{ github.sha }} -f EcomApp/Dockerfile .

  docker-compose:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config -q

  # Deploy job - runs on tags (manual trigger for now)
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-compose]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: EcomApi/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/ecom-api:${{ github.ref_name }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: EcomApp/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/ecom-web:${{ github.ref_name }}